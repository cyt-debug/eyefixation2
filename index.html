<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>眼動儀訓練播放器 (鼠標模式)</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            flex-wrap: wrap;
        }
        input[type="text"], select {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            border: 2px solid #ccc;
            border-radius: 6px;
            min-width: 250px;
        }
        button {
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.btn-share {
            background-color: #28a745;
        }
        button.btn-share:hover {
            background-color: #218838;
        }
        #player-container {
            position: relative;
            width: 800px;
            height: 450px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-top: 10px;
        }
        #player {
            width: 100%;
            height: 100%;
            pointer-events: none; /* 防止 iframe 攔截滑鼠事件 */
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(0, 0, 0, 0); 
            cursor: pointer;
        }
        #status {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 6px;
            text-align: center;
            width: 100%;
            max-width: 760px;
        }
        .status-ready { color: #555; background-color: #e0e0e0; }
        .status-looking { color: #2e7d32; background-color: #e8f5e9; }
        .status-away { color: #c62828; background-color: #ffebee; }
    </style>
</head>
<body>

    <h1>眼動儀注視訓練系統</h1>

    <div class="controls">
        <input type="text" id="youtubeUrl" placeholder="貼上 YouTube 網址或 11 位數影片 ID (例如：dQw4w9WgXcQ)">
        <button onclick="loadVideoFromInput()">載入影片</button>
        <button onclick="copyShareableLink()" class="btn-share">複製此影片專屬連結</button>
    </div>

    <!-- 歷史播放紀錄快速選擇 -->
    <div class="controls">
        <select id="historySelect" onchange="loadFromHistory(this.value)">
            <option value="">-- 快速選擇最近播放過的影片 --</option>
        </select>
    </div>

    <div id="player-container">
        <div id="player"></div>
        <div id="overlay"></div>
    </div>

    <div id="status" class="status-ready">狀態：請將眼動儀視線（鼠標）移入影片框內開始播放</div>

    <script>
        let player;
        let awayTimer = null;
        let apiReady = false;
        let currentVideoId = 'dQw4w9WgXcQ'; // 預設影片
        
        const AWAY_THRESHOLD = 600; // 0.6 秒緩衝

        // 1. 解析網址帶入的參數 (Query Parameters)
        function getInitialVideoId() {
            const urlParams = new URLSearchParams(window.location.search);
            const param = urlParams.get('v') || urlParams.get('url');
            if (param) {
                const extracted = extractVideoId(param);
                if (extracted) return extracted;
            }
            return 'dQw4w9WgXcQ'; // 若無參數則載入預設影片
        }

        // 2. 初始化 YouTube API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            apiReady = true;
            currentVideoId = getInitialVideoId();

            player = new YT.Player('player', {
                height: '450',
                width: '800',
                videoId: currentVideoId,
                playerVars: {
                    'controls': 0,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': () => {
                        updateHistoryUI();
                    }
                }
            });
        }

        // 解析 11 位數 Video ID
        function extractVideoId(url) {
            if (!url) return null;
            url = url.trim();
            if (url.length === 11 && !url.includes('/') && !url.includes('.')) return url;
            
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // 切換影片邏輯
        function switchVideo(videoId, saveToHistory = true) {
            if (!apiReady || !player || typeof player.loadVideoById !== 'function') {
                alert('播放器載入中，請稍候 2 秒再試！');
                return;
            }

            if (videoId) {
                currentVideoId = videoId;
                player.loadVideoById(videoId);
                player.pauseVideo();
                
                // 更新瀏覽器網址列但不重新整理頁面
                const newUrl = `${window.location.origin}${window.location.pathname}?v=${videoId}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);

                if (saveToHistory) {
                    saveVideoToStorage(videoId);
                }

                updateStatus("已成功載入新影片！請將視線移入影片框內。", "status-ready");
            } else {
                alert('無法辨識網址，請確認輸入的是有效的 YouTube 連結或 11 位數 ID。');
            }
        }

        function loadVideoFromInput() {
            const input = document.getElementById('youtubeUrl').value;
            const videoId = extractVideoId(input);
            switchVideo(videoId);
        }

        function loadFromHistory(videoId) {
            if (videoId) {
                document.getElementById('youtubeUrl').value = videoId;
                switchVideo(videoId, false);
            }
        }

        // 3. 複製分享連結
        function copyShareableLink() {
            const shareUrl = `${window.location.origin}${window.location.pathname}?v=${currentVideoId}`;
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert(`已複製專屬連結！您可以直接將此網址加入書籤或發送給學生：\n\n${shareUrl}`);
            }).catch(err => {
                alert(`複製失敗，請直接複製瀏覽器網址列的連結。`);
            });
        }

        // 4. LocalStorage 歷史紀錄維護
        function saveVideoToStorage(videoId) {
            let history = JSON.parse(localStorage.getItem('eye_tracking_history') || '[]');
            // 避免重複加入
            history = history.filter(id => id !== videoId);
            history.unshift(videoId); // 加到最前面
            if (history.length > 10) history = history.slice(0, 10); // 只保留最近 10 筆
            localStorage.setItem('eye_tracking_history', JSON.stringify(history));
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const history = JSON.parse(localStorage.getItem('eye_tracking_history') || '[]');
            const select = document.getElementById('historySelect');
            select.innerHTML = '<option value="">-- 快速選擇最近播放過的影片 --</option>';
            
            history.forEach((id, index) => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.innerText = `歷史紀錄 ${index + 1}：影片 ID [ ${id} ]`;
                select.appendChild(opt);
            });
        }

        // 5. 鼠標/視線進入與離開監聽
        const overlay = document.getElementById('overlay');

        overlay.addEventListener('mouseenter', () => {
            if (awayTimer) {
                clearTimeout(awayTimer);
                awayTimer = null;
            }
            updateStatus("狀態：注視影片中（播放）", "status-looking");

            if (player && typeof player.playVideo === 'function') {
                player.unMute();
                player.playVideo().catch(() => {
                    player.mute();
                    player.playVideo();
                });
            }
        });

        overlay.addEventListener('mouseleave', () => {
            if (!awayTimer) {
                awayTimer = setTimeout(() => {
                    updateStatus("狀態：視線離開（暫停）", "status-away");
                    if (player && typeof player.pauseVideo === 'function') {
                        player.pauseVideo();
                    }
                }, AWAY_THRESHOLD);
            }
        });

        function updateStatus(text, className) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = text;
            statusDiv.className = className;
        }
    </script>
</body>
</html>
